name: Build AdventureLog Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - name: Build Android ARM64
        run: |
          cmake -S . -B build/adventure-log-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build/adventure-log-arm64 --target AdventureLog -j2
      - name: Package mod
        run: |
          mkdir -p AdventureLog/Resources/lib dist
          cp build/adventure-log-arm64/AdventureLog/libAdventureLog.android.arm64.so AdventureLog/Resources/lib/
          cd AdventureLog
          zip -r ../dist/冒险日志-AdventureLog-KernelLoader-AndroidARM64-v1.0.0-test.zip Info.json Manifest.json AdventureLog.json Resources
      - uses: actions/upload-artifact@v4
        with:
          name: AdventureLog-AndroidARM64-v1.0.0-test
          path: dist/冒险日志-AdventureLog-KernelLoader-AndroidARM64-v1.0.0-test.zip
