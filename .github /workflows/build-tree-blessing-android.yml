name: Build TreeBlessing Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - name: Build Android ARM64
        run: |
          cmake -S . -B build/tree-blessing-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build/tree-blessing-arm64 --target TreeBlessing -j2
      - name: Package mod
        run: |
          mkdir -p TreeBlessing/Resources/lib dist
          cp build/tree-blessing-arm64/TreeBlessing/libTreeBlessing.android.arm64.so \
             TreeBlessing/Resources/lib/
          cd TreeBlessing
          zip -r ../dist/树木祝福-TreeBlessing-KernelLoader-AndroidARM64-v1.0.0-test.zip \
            Info.json Manifest.json TreeBlessing.json Resources
      - uses: actions/upload-artifact@v4
        with:
          name: TreeBlessing-AndroidARM64-v1.0.0-test
          path: dist/树木祝福-TreeBlessing-KernelLoader-AndroidARM64-v1.0.0-test.zip
