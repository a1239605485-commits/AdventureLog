name: Build ThreeSpawn Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - name: Build Android ARM64
        run: |
          cmake -S . -B build/three-spawn-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build/three-spawn-arm64 --target ThreeSpawn -j2
      - name: Package mod
        run: |
          mkdir -p ThreeSpawn/Resources/lib dist
          cp build/three-spawn-arm64/ThreeSpawn/libThreeSpawn.android.arm64.so \
             ThreeSpawn/Resources/lib/
          cd ThreeSpawn
          zip -r ../dist/3倍刷怪-ThreeSpawn-KernelLoader-AndroidARM64-v1.1.0-test.zip \
            Info.json Manifest.json ThreeSpawn.json Resources
      - uses: actions/upload-artifact@v4
        with:
          name: ThreeSpawn-AndroidARM64-v1.1.0-test
          path: dist/3倍刷怪-ThreeSpawn-KernelLoader-AndroidARM64-v1.1.0-test.zip
